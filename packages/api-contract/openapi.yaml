                  data:
                    allOf:
                      - $ref: '#/components/schemas/Paginated'
                      - type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/QsrItem' }
        '304':
          description: Not Modified
          headers:
            ETag:
              schema: { type: string }
  /catalog/qsr/{slug}:
    get:
      tags: [catalog]
      security: []
