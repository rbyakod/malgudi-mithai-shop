openapi: 3.1.0
info:
  title: Mishran Mobile API
  version: 0.1.0
  description: |
    REST API consumed by the Mishran Android (v1) and iOS (v2) apps.
    All routes under /api/mobile/v1/* unless noted.
  contact:
    name: Mishran Engineering
    url: https://mishran.app
servers:
  - url: http://localhost:3000/api/mobile/v1
    description: Local dev
  - url: https://staging-api.mishran.app/api/mobile/v1
    description: Staging
  - url: https://api.mishran.app/api/mobile/v1
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - RATE_LIMITED
                - OTP_INVALID
                - OTP_EXPIRED
                - PINCODE_NOT_SERVICEABLE
                - CART_CHANGED
                - STOCK_INSUFFICIENT
                - PAYMENT_FAILED
                - PAYMENT_ABANDONED
                - ORDER_NOT_FOUND
                - INVALID_STATE_TRANSITION
                - TOKEN_EXPIRED
                - TOKEN_REVOKED
                - CONFLICT
                - VALIDATION
                - INTERNAL
                - OTP_PROVIDER_DOWN
            message:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: string
            traceId:
              type: string
    Customer:
      type: object
      required: [id, phone]
      properties:
        id: { type: string }
        phone: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        locale:
          type: string
          enum: [en, hi, kn, ta, te, mr, gu, bn, pa]
        createdAt: { type: string, format: date-time }
    Paginated:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: {} }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    OtpSendRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, pattern: '^\+[1-9]\d{6,14}$' }
    OtpSendResponse:
      type: object
      required: [requestId, expiresAt]
      properties:
        requestId: { type: string }
        expiresAt: { type: string, format: date-time }
    OtpVerifyRequest:
      type: object
      required: [requestId, code]
      properties:
        requestId: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
    OtpVerifyResponse:
      type: object
      required: [accessToken, refreshToken, customer]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        customer: { $ref: '#/components/schemas/Customer' }
    RefreshRequest:
      type: object
      description: Empty body — refresh token passed via Authorization header.
    RefreshResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    LogoutResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    ServiceableResponse:
      type: object
      required: [serviceable]
      properties:
        serviceable:
          type: boolean
        tier:
          type: string
          description: Service tier (e.g. shelf, fresh). Present only when serviceable.
        city:
          type: string
          description: City name. Present only when serviceable.
        slaDays:
          type: integer
          description: Estimated delivery SLA in days. Present only when serviceable.
        reason:
          type: string
          description: Reason code when not serviceable (e.g. invalid_pincode).
    Product:
      type: object
      required: [id, slug, name, family]
      description: |
        Catalog product. Mirrors collections/MithaiProducts.ts.
        `images` are resolved URLs (Payload upload refs flattened to strings).
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        family:
          type: string
          enum: [classic, original, sugar-free, regional, seasonal]
        displayPrice:
          type: [string, 'null']
          description: Display-only. Commerce deferred to Phase 8.
        freshnessStatus:
          type: [string, 'null']
          enum: [made-daily, made-to-order, batch-frozen, null]
        dietaryTags:
          type: array
          items: { type: string }
        allergens:
          type: array
          items: { type: string }
        ingredients:
          type: [string, 'null']
        shelfLife:
          type: [string, 'null']
        storage:
          type: [string, 'null']
        images:
          type: array
          items: { type: string }
        story:
          type: [string, 'null']
        karigar:
          type: [string, 'null']
          description: Karigar (artisan) relationship id, if any.
        updatedAt:
          type: [string, 'null']
          format: date-time
    CartItem:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, minLength: 1 }
        quantity:
          type: integer
          minimum: 1
    CartValidateRequest:
      type: object
      required: [items, pincode]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CartItem' }
        pincode:
          type: string
          pattern: '^[0-9]{6}$'
        slot:
          type: object
          required: [date, window]
          properties:
            date: { type: string }
            window: { type: string }
    OrderTotals:
      type: object
      required:
        [itemsTotalInPaise, deliveryFeeInPaise, taxesInPaise, discountInPaise, totalInPaise]
      description: |
        Order totals in paise (INR). All zero today; real pricing lands in
        Phase 8 alongside the commerce schema on MithaiProducts.
      properties:
        itemsTotalInPaise: { type: integer, minimum: 0 }
        deliveryFeeInPaise: { type: integer, minimum: 0 }
        taxesInPaise: { type: integer, minimum: 0 }
        discountInPaise: { type: integer, minimum: 0 }
        totalInPaise: { type: integer, minimum: 0 }
    CartSnapshotItem:
      type: object
      required: [productId, slug, name, quantity, freshnessStatus]
      properties:
        productId: { type: string }
        slug: { type: string }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        freshnessStatus:
          type: [string, 'null']
          enum: [made-daily, made-to-order, batch-frozen, null]
    CartSnapshot:
      type: object
      required: [snapshotId, customerId, items, totals, pincodeTier, expiresAt]
      properties:
        snapshotId: { type: string, format: uuid }
        customerId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartSnapshotItem' }
        totals: { $ref: '#/components/schemas/OrderTotals' }
        pincodeTier:
          type: [string, 'null']
          description: Service tier of the resolved pincode (e.g. shelf, fresh).
        expiresAt: { type: string, format: date-time }

security:
  - bearerAuth: []

paths:
  /auth/otp/send:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpSendRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OtpSendResponse' }
        '429':
          description: Rate limited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: SMS provider down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/otp/verify:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OtpVerifyResponse' }
        '400':
          description: Invalid OTP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: OTP expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RefreshResponse' }
        '401':
          description: Token invalid or revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      tags: [auth]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LogoutResponse' }
  /catalog/products:
    get:
      tags: [catalog]
      security: []
      parameters:
        - in: header
          name: If-None-Match
          schema: { type: string }
        - in: query
          name: family
          schema:
            type: string
            enum: [classic, original, sugar-free, regional, seasonal]
        - in: query
          name: freshnessStatus
          schema:
            type: string
            enum: [made-daily, made-to-order, batch-frozen]
        - in: query
          name: dietaryTags
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - in: query
          name: q
          schema: { type: string }
          description: Case-insensitive name substring (Payload `contains`).
        - in: query
          name: page
          schema: { type: integer, default: 1, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema:
                type: string
                description: |
                  SHA-1 of `id:updatedAt` joined list, wrapped in double
                  quotes, truncated to 16 hex chars. Send back via
                  `If-None-Match` to get a 304 when unchanged.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Paginated'
                      - type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Product' }
        '304':
          description: Not Modified — client's If-None-Match matched current ETag.
          headers:
            ETag:
              schema: { type: string }
  /catalog/products/{slug}:
    get:
      tags: [catalog]
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
          description: Unique product slug (collections/MithaiProducts.slug).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '404':
          description: Not Found — no product matches the given slug.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { $ref: '#/components/schemas/Error' }
  /catalog/serviceable:
    get:
      tags: [catalog]
      security: []
      description: Check if a pincode is serviceable for delivery.
      parameters:
        - in: query
          name: pincode
          required: true
          schema:
            type: string
            pattern: '^[0-9]{6}$'
          description: 6-digit Indian postal code.
      responses:
        '200':
          description: OK — pincode validated (serviceable or not).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ServiceableResponse' }
        '422':
          description: Unprocessable Entity — pincode format invalid.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ServiceableResponse' }
  /cart/validate:
    post:
      tags: [cart]
      description: |
        Validate the customer's cart: authenticate, re-check pincode
        serviceability, re-fetch each product to confirm it still exists,
        and return a cart snapshot valid for 10 minutes.

        NOTE: totals are all zero today — commerce / variant pricing on
        MithaiProducts is deferred to Phase 8. This endpoint gives mobile
        clients a stable contract for cart shape + availability now.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartValidateRequest' }
      responses:
        '200':
          description: OK — cart snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CartSnapshot' }
        '404':
          description: Not Found — one or more products no longer exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Unprocessable Entity — invalid body or unserviceable pincode.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

