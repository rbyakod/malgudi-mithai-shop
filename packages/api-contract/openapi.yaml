openapi: 3.1.0
info:
  title: Mishran Mobile API
  version: 0.1.0
  description: |
    REST API consumed by the Mishran Android (v1) and iOS (v2) apps.
    All routes under /api/mobile/v1/* unless noted.
  contact:
    name: Mishran Engineering
    url: https://mishran.app
servers:
  - url: http://localhost:3000/api/mobile/v1
    description: Local dev
  - url: https://staging-api.mishran.app/api/mobile/v1
    description: Staging
  - url: https://api.mishran.app/api/mobile/v1
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - RATE_LIMITED
                - OTP_INVALID
                - OTP_EXPIRED
                - PINCODE_NOT_SERVICEABLE
                - CART_CHANGED
                - STOCK_INSUFFICIENT
                - PAYMENT_FAILED
                - PAYMENT_ABANDONED
                - ORDER_NOT_FOUND
                - INVALID_STATE_TRANSITION
                - TOKEN_EXPIRED
                - TOKEN_REVOKED
                - CONFLICT
                - VALIDATION
                - INTERNAL
                - OTP_PROVIDER_DOWN
            message:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: string
            traceId:
              type: string
    Customer:
      type: object
      required: [id, phone]
      properties:
        id: { type: string }
        phone: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        locale:
          type: string
          enum: [en, hi, kn, ta, te, mr, gu, bn, pa]
        createdAt: { type: string, format: date-time }
    Paginated:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: {} }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    OtpSendRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, pattern: '^\+[1-9]\d{6,14}$' }
    OtpSendResponse:
      type: object
      required: [requestId, expiresAt]
      properties:
        requestId: { type: string }
        expiresAt: { type: string, format: date-time }
    OtpVerifyRequest:
      type: object
      required: [requestId, code]
      properties:
        requestId: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
    OtpVerifyResponse:
      type: object
      required: [accessToken, refreshToken, customer]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        customer: { $ref: '#/components/schemas/Customer' }
    RefreshRequest:
      type: object
      description: Empty body — refresh token passed via Authorization header.
    RefreshResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    LogoutResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

security:
  - bearerAuth: []

paths:
  /auth/otp/send:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpSendRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OtpSendResponse' }
        '429':
          description: Rate limited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: SMS provider down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/otp/verify:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OtpVerifyResponse' }
        '400':
          description: Invalid OTP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: OTP expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RefreshResponse' }
        '401':
          description: Token invalid or revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      tags: [auth]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LogoutResponse' }
