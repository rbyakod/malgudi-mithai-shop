openapi: 3.1.0
info:
  title: Mishran Mobile API
  version: 0.1.0
  description: |
    REST API consumed by the Mishran Android (v1) and iOS (v2) apps.
    All routes under /api/mobile/v1/* unless noted.
  contact:
    name: Mishran Engineering
    url: https://mishran.app
servers:
  - url: http://localhost:3000/api/mobile/v1
    description: Local dev
  - url: https://mishran.pranavb.com/api/mobile/v1
    description: Production (the storefront domain serves the API; a dedicated
      api domain was never registered — api.mishran.app is NXDOMAIN)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - RATE_LIMITED
                - OTP_INVALID
                - OTP_EXPIRED
                - PINCODE_NOT_SERVICEABLE
                - CART_CHANGED
                - STOCK_INSUFFICIENT
                - PAYMENT_FAILED
                - PAYMENT_ABANDONED
                - ORDER_NOT_FOUND
                - SNAPSHOT_NOT_FOUND
                - PRODUCT_NOT_FOUND
                - STORY_NOT_FOUND
                - NOT_FOUND
                - INVALID_STATE_TRANSITION
                - TOKEN_EXPIRED
                - TOKEN_REVOKED
                - CONFLICT
                - VALIDATION
                - INVALID_COUPON
                - INTERNAL
                - OTP_PROVIDER_DOWN
            message:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: string
            traceId:
              type: string
    Customer:
      type: object
      required: [id, phone]
      properties:
        id: { type: string }
        phone: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        locale:
          type: string
          enum: [en, hi, kn, ta, te, mr, gu, bn, pa]
        createdAt: { type: string, format: date-time }
    Paginated:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: {} }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    OtpSendRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, pattern: '^\+[1-9]\d{6,14}$' }
    OtpSendResponse:
      type: object
      required: [requestId, expiresAt]
      properties:
        requestId: { type: string }
        expiresAt: { type: string, format: date-time }
    OtpVerifyRequest:
      type: object
      required: [requestId, code]
      properties:
        requestId: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
    OtpVerifyResponse:
      type: object
      required: [accessToken, refreshToken, customer]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        customer: { $ref: '#/components/schemas/Customer' }
    RefreshRequest:
      type: object
      description: Empty body — refresh token passed via Authorization header.
    RefreshResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    LogoutResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    ServiceableResponse:
      type: object
      required: [serviceable]
      properties:
        serviceable:
          type: boolean
        tier:
          type: string
          description: Service tier (e.g. shelf, fresh). Present only when serviceable.
        city:
          type: string
          description: City name. Present only when serviceable.
        slaDays:
          type: integer
          description: Estimated delivery SLA in days. Present only when serviceable.
        reason:
          type: string
          description: Reason code when not serviceable (e.g. invalid_pincode).
    Product:
      type: object
      required: [id, slug, name, family]
      description: |
        Catalog product. Mirrors collections/MithaiProducts.ts.
        `images` are resolved URLs (Payload upload refs flattened to strings).
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        family:
          type: string
          enum: [classic, original, sugar-free, regional, seasonal]
        displayPrice:
          type: [string, 'null']
          description: Display-only. Commerce deferred to Phase 8.
        weight:
          type: [string, 'null']
          description: 'Net pack weight as display text, e.g. "250 g", "1 kg". Drives the pack-size chip.'
        featured:
          type: boolean
          description: Flags the product for the apps' Best sellers rail.
        freshnessStatus:
          type: [string, 'null']
          enum: [made-daily, made-to-order, batch-frozen, null]
        dietaryTags:
          type: array
          items: { type: string }
        allergens:
          type: array
          items: { type: string }
        ingredients:
          type: [string, 'null']
        shelfLife:
          type: [string, 'null']
        storage:
          type: [string, 'null']
        images:
          type: array
          items: { type: string }
        story:
          type: [string, 'null']
        karigar:
          type: [string, 'null']
          description: Karigar (artisan) relationship id, if any.
        karigarName:
          type: [string, 'null']
          description: >
            Karigar display name for the PDP provenance strip. Present only
            when the relationship is populated; null when the field holds a
            bare id or is unset.
        leadTime:
          type: [string, 'null']
          description: 'e.g. "Made to order in 24h" — freshness promise + trust strip.'
        updatedAt:
          type: [string, 'null']
          format: date-time
    Story:
      type: object
      required: [id, slug, title, pillar]
      description: |
        Published journal story. Mirrors collections/Stories.ts;
        `_status: draft` docs are excluded server-side.
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        pillar:
          type: string
          enum: [farm, milk, karigar, karigari, packaging, festival, regional, recipe, journal]
        excerpt:
          type: [string, 'null']
        heroImage:
          type: [string, 'null']
          description: Resolved hero image URL (Payload upload flattened).
        publishedAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
    StoryDetail:
      type: object
      description: Story plus flattened body text. /stories/{slug} response.
      allOf:
        - $ref: '#/components/schemas/Story'
        - type: object
          properties:
            body:
              type: [string, 'null']
              description: Lexical rich text flattened to paragraphs joined by newlines.
    QsrItem:
      type: object
      required: [id, slug, name]
      description: |
        QSR counter-menu item. Mirrors collections/QsrMenuItems.ts.
        Walk-in vertical — no price, no cart. `slug` is server-computed
        via slugify(name); the collection has no slug field.
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        category:
          type: [string, 'null']
        description:
          type: [string, 'null']
        image:
          type: [string, 'null']
          description: Resolved image URL (singular upload field).
        veg:
          type: [boolean, 'null']
        spiceLevel:
          type: [integer, 'null']
        availableAtStores:
          type: array
          items: { type: string }
        updatedAt:
          type: [string, 'null']
          format: date-time
    SnackRetailer:
      type: object
      required: [label, url]
      properties:
        label: { type: string }
        url: { type: string }
    Snack:
      type: object
      required: [id, slug, name]
      description: |
        Retail snack product. Mirrors collections/SnackProducts.ts.
        Retail-only vertical — MSRP is display; purchase CTAs route to
        external retailers. `slug` is server-computed via slugify(name).
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        category:
          type: [string, 'null']
        description:
          type: [string, 'null']
        images:
          type: array
          items: { type: string }
        weight:
          type: [string, 'null']
        msrp:
          type: [string, 'null']
        retailers:
          type: array
          items: { $ref: '#/components/schemas/SnackRetailer' }
        updatedAt:
          type: [string, 'null']
          format: date-time
    Merch:
      type: object
      required: [id, slug, name]
      description: |
        Merchandise product. Mirrors collections/MerchProducts.ts.
        Enquiry-led vertical — `availability: enquiry-only` routes the
        app UI to the leads form. `slug` is server-computed via slugify(name).
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        type:
          type: [string, 'null']
        description:
          type: [string, 'null']
        images:
          type: array
          items: { type: string }
        price:
          type: [string, 'null']
        availability:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
    Brand:
      type: object
      required: [whatsappNumber, whatsappDigits]
      description: |
        Brand support contact + display copy for the apps' help surfaces
        and home masthead. Only WhatsApp fields from the analytics-settings
        global are exposed — analytics IDs (GA4/Pixel/Hotjar) deliberately
        do NOT appear on this public endpoint. WhatsApp falls back to the
        shared placeholder number when unset; brand copy fields are null
        when the brand-settings global omits them (apps render localized
        fallback copy in that case).
      properties:
        whatsappNumber:
          type: string
          description: Display form, e.g. +91-98765-43210.
        whatsappDigits:
          type: string
          description: Digits only, for wa.me deep links.
        brandName:
          type: [string, "null"]
          description: Brand name from the brand-settings global, null when unset.
        tagline:
          type: [string, "null"]
          description: One-line tagline from the brand-settings global, null when unset.
        positioning:
          type: [string, "null"]
          description: Short positioning statement from the brand-settings global, null when unset.
    HeroSlide:
      type: object
      required: [id, vertical, slug, name, imageURL, imageAlt]
      description: |
        One resolved slide of the admin-curated `home-hero` global — the
        same list the web hero renders. `vertical` + `slug` is the apps'
        deep-link vocabulary (product detail for mithai, vertical detail
        otherwise). Draft products and products without an image or slug
        are dropped server-side; gift-boxes slides are skipped (no app
        surface — web routes them into /build-a-gift).
      properties:
        id:
          type: string
          description: Product id (unique within its collection).
        vertical:
          type: string
          enum: [mithai, qsr, snacks, merch]
        slug:
          type: string
        name:
          type: string
          description: captionOverride when the admin set one, else product name.
        priceLabel:
          type: [string, 'null']
          description: Mithai displayPrice / merch price; absent for other verticals.
        imageURL:
          type: string
        imageAlt:
          type: string
    Hero:
      type: object
      required: [slides, autoplayMs]
      description: |
        Home hero carousel data. Empty `slides` means the global is unset or
        nothing resolved — the apps keep their local fallback hero (first
        featured product), never a blank screen.
      properties:
        slides:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/HeroSlide' }
        autoplayMs:
          type: integer
          minimum: 3000
          maximum: 15000
          description: Autoplay interval; clamped server-side. Apps must not autoplay under reduced motion.
    CartItem:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, minLength: 1 }
        quantity:
          type: integer
          minimum: 1
        packLabel:
          type: string
          minLength: 1
          description: |
            Optional pack-size label from the web PDP's derived selector
            (e.g. "250g", "500g", "1 kg"). When present the server prices
            the matching derived pack option; when absent the product's
            base display price is used. Mobile apps omit it today.
    CartValidateRequest:
      type: object
      required: [items, pincode]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CartItem' }
        pincode:
          type: string
          pattern: '^[0-9]{6}$'
        slot:
          type: object
          required: [date, window]
          properties:
            date: { type: string }
            window: { type: string }
        couponCode:
          type: string
          minLength: 1
          maxLength: 40
          description: |
            Optional coupon code to resolve and fold into totals. An invalid
            code fails the request with INVALID_COUPON (a customer mid-
            checkout wants the error, not a silent full-price snapshot).
    OrderTotals:
      type: object
      required:
        [itemsTotalInPaise, deliveryFeeInPaise, taxesInPaise, discountInPaise, totalInPaise]
      description: |
        Order totals in paise (INR). itemsTotal is the sum of server-priced
        snapshot lines (priceInPaise x quantity). deliveryFee is a flat fee
        by pincode serviceability tier — fresh (same-city, ₹49 default) vs
        shelf-stable (courier, ₹99 default); both env-tunable server-side.
        taxes is always 0: catalog prices are MRP inclusive of GST.
        discount is 0 unless a validated coupon was applied at validate
        time. total = itemsTotal - discount + deliveryFee.
      properties:
        itemsTotalInPaise: { type: integer, minimum: 0 }
        deliveryFeeInPaise: { type: integer, minimum: 0 }
        taxesInPaise: { type: integer, minimum: 0 }
        discountInPaise: { type: integer, minimum: 0 }
        totalInPaise: { type: integer, minimum: 0 }
    CartSnapshotItem:
      type: object
      required: [productId, slug, name, quantity, freshnessStatus]
      properties:
        productId: { type: string }
        slug: { type: string }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        freshnessStatus:
          type: [string, 'null']
          enum: [made-daily, made-to-order, batch-frozen, null]
        packLabel:
          type: [string, 'null']
          description: |
            Pack-size label the line was priced against (present when the
            request's CartItem carried one); null for base-price lines.
        unit:
          type: string
          description: |
            Pack identity of the priced line, e.g. "500g" / "1 kg" / "250 g".
        priceInPaise:
          type: integer
          minimum: 0
          description: Server-resolved line price in paise (per unit, not x quantity).
        image:
          type: [string, 'null']
          description: First product image URL (absolute), when one exists.
    CartSnapshot:
      type: object
      required: [snapshotId, customerId, items, totals, pincodeTier, expiresAt]
      properties:
        snapshotId: { type: string, format: uuid }
        customerId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartSnapshotItem' }
        totals: { $ref: '#/components/schemas/OrderTotals' }
        pincodeTier:
          type: [string, 'null']
          description: Service tier of the resolved pincode (e.g. shelf, fresh).
        couponCode:
          type: [string, 'null']
          description: |
            The coupon code whose discount is folded into totals, when a
            valid one was supplied to /cart/validate. Null when none.
        freeDeliveryThresholdInPaise:
          type: [integer, 'null']
          minimum: 0
          description: |
            The pincode tier's free-delivery threshold in paise (0 disables
            the waiver; null when the tier is unknown). Clients use this to
            render threshold progress — never a baked-in constant.
        expiresAt: { type: string, format: date-time }
    CartEstimateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/CartItem' }
        pincode:
          type: string
          pattern: '^[0-9]{6}$'
          description: |
            Optional. With a SERVICEABLE pincode the estimate resolves the
            tier, delivery fee, and free-delivery threshold. Absent or
            unserviceable → null tier, zero fee, null threshold (the
            client shows its no-pincode copy).
    CartEstimate:
      type: object
      required:
        [itemsTotalInPaise, deliveryFeeInPaise, discountInPaise,
         totalInPaise, pincodeTier, freeDeliveryThresholdInPaise,
         freeDeliveryEligible]
      description: |
        Read-only pricing preview of a cart — exactly the /cart/validate
        math (server-side line pricing, tier fee, threshold waiver) but
        persisted nowhere and authenticated by nobody. Guest carts use it
        to show delivery fees before sign-in. Stale/unpriceable lines
        still error (PRODUCT_NOT_FOUND / VALIDATION) so callers can tell
        "estimate" from "your cart is broken".
      properties:
        itemsTotalInPaise: { type: integer, minimum: 0 }
        deliveryFeeInPaise: { type: integer, minimum: 0 }
        discountInPaise: { type: integer, minimum: 0 }
        totalInPaise: { type: integer, minimum: 0 }
        pincodeTier:
          type: [string, 'null']
          description: Service tier of the resolved pincode; null when no/unserviceable pincode was sent.
        freeDeliveryThresholdInPaise:
          type: [integer, 'null']
          minimum: 0
          description: Tier's free-delivery threshold in paise; null when the tier is unknown.
        freeDeliveryEligible:
          type: boolean
          description: True when the tier is known and the subtotal met the threshold (fee already zeroed).
    RazorpayCreateOrderRequest:
      type: object
      required: [snapshotId, deliveryAddressId]
      properties:
        snapshotId:
          type: string
          description: |
            Cart snapshot id returned by POST /cart/validate. The snapshot
            must belong to the calling customer and must not be expired.
        deliveryAddressId:
          type: string
          description: Customer address id to ship the order to.
    RazorpayCreateOrderResponse:
      type: object
      required: [orderId, razorpayOrderId, amountInPaise, keyId]
      properties:
        orderId:
          type: string
          description: Internal Mishran order id (also used as Razorpay receipt).
        razorpayOrderId:
          type: string
          description: Provider-side order id; pass to the Razorpay checkout widget.
        amountInPaise:
          type: integer
          description: Order total in paise (1 INR = 100 paise).
        keyId:
          type: string
          description: Public Razorpay key id for the checkout widget (NEXT_PUBLIC_RAZORPAY_KEY_ID).
    RazorpayVerifyRequest:
      type: object
      required: [orderId, razorpayPaymentId, signature]
      properties:
        orderId:
          type: string
          description: Internal Mishran order id returned by create-order.
        razorpayPaymentId:
          type: string
          description: Razorpay payment id from the checkout callback.
        signature:
          type: string
          description: HMAC signature returned by Razorpay at checkout completion.
    Order:
      type: object
      required:
        - id
        - customerId
        - items
        - totals
        - status
        - paymentStatus
        - deliveryAddressId
        - source
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        customerId: { type: string }
        items:
          type: array
          items:
            type: object
            required: [productId, slug, name, quantity, unit, priceInPaise]
            properties:
              productId: { type: string }
              slug: { type: string }
              name: { type: string }
              quantity: { type: integer, minimum: 1 }
              packLabel:
                type: [string, 'null']
                description: |
                  Pack-size label the line was priced against (cart ids of
                  the form `${productId}:${packLabel}`). Copied through from
                  the cart snapshot so one-tap reorder re-adds the exact
                  pack. Null/absent on base-pack lines and legacy orders.
              unit: { type: string }
              priceInPaise: { type: integer, minimum: 0 }
              image:
                type: [string, 'null']
        totals: { $ref: '#/components/schemas/OrderTotals' }
        status:
          type: string
          enum:
            [created, pending_payment, confirmed, packed, dispatched,
             out_for_delivery, delivered, payment_failed, cancelled,
             returned, failed_delivery, abandoned]
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refunded, partially_refunded]
        paymentMethod:
          type: string
          enum: [razorpay, cod]
          default: razorpay
          description: |
            How the order collects its money. razorpay: prepaid through the
            Razorpay sheet (razorpayOrderId set; webhook/verify settle it).
            cod: cash at the door — born status=confirmed with
            paymentStatus=pending until staff mark cash collected;
            razorpayOrderId stays null so payment-side jobs skip it.
            Legacy orders read as razorpay.
        couponCode:
          type: [string, 'null']
          description: Coupon whose discount is reflected in totals.discountInPaise, when one was applied.
        deliveryAddressId: { type: string }
        slot:
          type: [object, 'null']
          properties:
            date: { type: string }
            window: { type: string }
        source:
          type: string
          enum: [mobile-android, mobile-ios, web]
        razorpayOrderId:
          type: [string, 'null']
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RazorpayVerifyResponse:
      type: object
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/Order' }

    # ---- Task 5.3 ----
    Address:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        lat: { type: number }
        lng: { type: number }
        tag: { type: string, enum: [home, work, other] }
        isDefault: { type: boolean }
    AddressInput:
      type: object
      required: [line1, city, state, pincode]
      properties:
        line1: { type: string, minLength: 1 }
        line2: { type: string }
        city: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        pincode: { type: string, minLength: 1, maxLength: 10 }
        lat: { type: number }
        lng: { type: number }
        tag: { type: string, enum: [home, work, other] }
        isDefault: { type: boolean }
    PassDeviceInput:
      type: object
      required: [serialNumber, pushToken]
      properties:
        serialNumber: { type: string, minLength: 1, description: Pass serial (also the pass.json serial). }
        pushToken: { type: string, minLength: 1, description: APNs .pass update token issued by Wallet. }

    # ---- Conversion batch, Batch A ----
    ReviewInput:
      type: object
      required: [productId, rating]
      properties:
        productId:
          type: string
          minLength: 1
          description: Product being reviewed (mithai-products id).
        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string
          maxLength: 2000
          description: Optional free-text review.
        authorName:
          type: string
          maxLength: 120
          description: Optional display name; falls back to the customer record.
    Review:
      type: object
      required: [id, productId, rating, verifiedPurchase, status, created]
      properties:
        id: { type: string }
        productId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: [string, 'null'] }
        authorName: { type: [string, 'null'] }
        verifiedPurchase:
          type: boolean
          description: Server-stamped true when the customer has a delivered order containing the product.
        orderId: { type: [string, 'null'], description: Linked delivered order when verifiedPurchase is true. }
        status: { type: string, enum: [pending, approved, rejected] }
        created:
          type: boolean
          description: True when a new review row was created; false when an existing (customer, product) review was updated.
    PublicReview:
      type: object
      required: [id, rating, authorDisplayName, verifiedPurchase, createdAt]
      description: |
        A moderation-approved review as the public sees it. Author is a
        display name only — customer ids and phones never leave the
        server. Served by GET /reviews (B10).
      properties:
        id: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: [string, 'null'] }
        authorDisplayName:
          type: [string, 'null']
          description: Captured authorName, else the customer's saved name; null when neither exists (render "Anonymous").
        verifiedPurchase:
          type: boolean
          description: Server-stamped true when the author had a delivered order containing the product.
        createdAt: { type: string, format: date-time }
    ReviewList:
      type: object
      required: [items, averageRating, total, page, pageSize]
      description: One page of approved reviews plus the product's aggregate rating over ALL approved reviews.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicReview' }
        averageRating:
          type: [number, 'null']
          description: Mean rating across all approved reviews; null when there are none.
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
    CodCreateOrderRequest:
      type: object
      required: [snapshotId, deliveryAddressId]
      description: |
        Cash-on-delivery order creation — same contract as Razorpay
        create-order minus the provider: consume a validated cart
        snapshot, create the order born confirmed with cash pending at
        the door. Full route lands with the COD batch (B12); declared
        here so clients codegen against the final shape once.
      properties:
        snapshotId:
          type: string
          description: Cart snapshot id returned by POST /cart/validate; must belong to the caller and be unexpired.
        deliveryAddressId:
          type: string
          description: Customer address id to ship the order to.

security:
  - bearerAuth: []

paths:
  /auth/otp/send:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpSendRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OtpSendResponse' }
        '429':
          description: Rate limited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: SMS provider down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/otp/verify:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OtpVerifyResponse' }
        '400':
          description: Invalid OTP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: OTP expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RefreshResponse' }
        '401':
          description: Token invalid or revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      tags: [auth]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LogoutResponse' }
  /auth/apple:
    post:
      tags: [auth]
      security: []
      description: |
        Sign in with Apple. The iOS client obtains an identityToken (RS256
        JWT) from ASAuthorizationAppleIDCredential and POSTs it here.
        Server verifies the token against Apple JWks, rejects replay
        (same identityToken twice → 409), upserts a customer keyed by the
        Apple `sub`, and returns the same JWT pair + customer shape as
        /auth/otp/verify so the client's post-login flow is identical.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken: { type: string }
                name:
                  type: string
                  description: Optional display name passed on first authorization.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OtpVerifyResponse' }
        '401':
          description: Token invalid or revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: identityToken replay detected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /catalog/products:
    get:
      tags: [catalog]
      security: []
      parameters:
        - in: header
          name: If-None-Match
          schema: { type: string }
        - in: query
          name: family
          schema:
            type: string
            enum: [classic, original, sugar-free, regional, seasonal]
        - in: query
          name: freshnessStatus
          schema:
            type: string
            enum: [made-daily, made-to-order, batch-frozen]
        - in: query
          name: dietaryTags
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - in: query
          name: q
          schema: { type: string }
          description: Case-insensitive name substring (Payload `contains`).
        - in: query
          name: page
          schema: { type: integer, default: 1, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema:
                type: string
                description: |
                  SHA-1 of `id:updatedAt` joined list, wrapped in double
                  quotes, truncated to 16 hex chars. Send back via
                  `If-None-Match` to get a 304 when unchanged.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Paginated'
                      - type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Product' }
        '304':
          description: Not Modified — client's If-None-Match matched current ETag.
          headers:
            ETag:
              schema: { type: string }
  /catalog/products/{slug}:
    get:
      tags: [catalog]
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
          description: Unique product slug (collections/MithaiProducts.slug).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '404':
          description: Not Found — no product matches the given slug.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { $ref: '#/components/schemas/Error' }
  /catalog/qsr:
    get:
      tags: [catalog]
