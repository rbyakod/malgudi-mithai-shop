              schema: { type: string }
  /catalog/merch/{slug}:
    get:
      tags: [catalog]
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
          description: slugify(name) — server-computed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Merch' }
        '404':
          description: Not Found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /catalog/serviceable:
    get:
      tags: [catalog]
      security: []
      description: Check if a pincode is serviceable for delivery.
      parameters:
        - in: query
          name: pincode
          required: true
          schema:
            type: string
            pattern: '^[0-9]{6}$'
          description: 6-digit Indian postal code.
      responses:
        '200':
          description: OK — pincode validated (serviceable or not).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ServiceableResponse' }
        '422':
          description: Unprocessable Entity — pincode format invalid.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ServiceableResponse' }
  /cart/estimate:
    post:
      tags: [cart]
      security: []
      description: |
        Read-only pricing preview of a cart — the exact /cart/validate
        math (server-side line re-pricing, pincode tier lookup, tier
        delivery fee, free-delivery threshold waiver) with nothing
        persisted and NO sign-in required. Guest carts call this to show
        delivery fees and threshold progress before checkout. Unpriceable
        or vanished lines error exactly like validate so callers can
        distinguish "here's your estimate" from "your cart is stale";
        pincode serviceability is informational here — a known tier
        prices its real fee/threshold, while an absent or unserviceable
        pincode yields a null tier, no fee, and no threshold (nothing to
        estimate against; the client shows its no-pincode copy). Validate
        enforces serviceability for real.
        Rate-limited per client IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartEstimateRequest' }
      responses:
        '200':
          description: OK — estimate (never a snapshot; nothing persisted).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CartEstimate' }
        '404':
          description: Not Found — one or more products no longer exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Unprocessable Entity — invalid body or unpriceable line.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too Many Requests — per-IP rate limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /cart/validate:
    post:
      tags: [cart]
      description: |
        Validate the customer's cart: authenticate, re-check pincode
        serviceability, re-fetch each product to confirm it still exists,
        price every line server-side (optional per-item packLabel prices
        the matching derived pack size; unpriceable lines like "on
        request" are rejected 422), enforce the fresh-tier rule (made-daily
        items only ship to fresh-tier pincodes), normalize iOS relative
        slot tokens, persist a tamper-evident cart snapshot with real
        totals (subtotal + flat delivery fee by tier; taxes 0, MRP
        inclusive of GST), and return the snapshot id + shape valid for
        10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartValidateRequest' }
      responses:
        '200':
          description: OK — cart snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CartSnapshot' }
        '404':
          description: Not Found — one or more products no longer exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Unprocessable Entity — invalid body or unserviceable pincode.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders:
    get:
      tags: [orders]
      description: |
        List the authenticated customer's own orders, newest first. Pagination
        via `page` and `pageSize` query params; pageSize is capped at 50.
        Non-integer or NaN values fall back to the defaults (page=1, pageSize=20).
        The customer id is taken from the verified access token; a forged
        `customerId` in a query string is never honored.
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: OK — paginated list of the caller's orders.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items, total, page, pageSize]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
                      total: { type: integer, minimum: 0 }
                      page: { type: integer, minimum: 1 }
                      pageSize: { type: integer, minimum: 1, maximum: 50 }
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/{id}:
    get:
      tags: [orders]
      description: |
        Fetch a single order by id. Returns 404 ORDER_NOT_FOUND both when
        the id does not exist and when the order belongs to a different
        customer (no existence leak).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK — the requested order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not Found — order id unknown or belongs to another customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/cod:
    post:
      tags: [orders]
      description: |
        Create a cash-on-delivery order from a validated cart snapshot:
        requireCustomer, snapshot ownership + 10-minute expiry checks
        identical to Razorpay create-order, then the order is born
        status=confirmed / paymentStatus=pending / paymentMethod=cod with
        razorpayOrderId null (payment-side jobs skip it). Cash is marked
        collected by staff (orders console). Route lands with the COD
        batch (B12); declared here so client codegen sees the shape once.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodCreateOrderRequest' }
      responses:
        '200':
          description: OK — the created COD order (born confirmed).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not Found — snapshot unknown, expired, or belongs to another customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Unprocessable Entity — invalid body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /payments/razorpay/create-order:
    post:
      tags: [payments]
      description: |
        Create an internal order + a Razorpay order from a persisted cart
        snapshot. Idempotent: a replay with the same Idempotency-Key and
        body returns the cached response without re-running side effects.
        The X-Client-Source header selects the order `source` field
        (mobile-android | mobile-ios | web); defaults to mobile-android.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
          description: Optional. When set, the response is cached for 24h.
        - in: header
          name: X-Client-Source
          required: false
          schema:
            type: string
            enum: [mobile-android, mobile-ios, web]
            default: mobile-android
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RazorpayCreateOrderRequest' }
      responses:
        '200':
          description: OK — order + Razorpay order created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RazorpayCreateOrderResponse' }
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not Found — snapshot does not exist or belongs to another customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Conflict — Idempotency-Key reused with a different body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            Unprocessable Entity — invalid body, unsupported X-Client-Source,
            or the cart snapshot has expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: |
            Internal Server Error — Razorpay order creation failed. The
            internal order row is left in pending_payment. Retry with a
            new Idempotency-Key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /payments/razorpay/verify:
    post:
      tags: [payments]
      description: |
        Verify the Razorpay checkout signature, capture the payment, and
        transition the order from pending_payment to confirmed. Safe to
        retry: signature is always re-verified, and an already-captured
        payment row short-circuits the transition path. Idempotent at the
        HTTP layer when an Idempotency-Key is supplied.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RazorpayVerifyRequest' }
      responses:
        '200':
          description: OK — payment verified, order confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RazorpayVerifyResponse' }
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Payment Failed — signature invalid or no Razorpay order bound.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not Found — order id unknown or belongs to another customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Unprocessable Entity — invalid body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---- Task 5.3: device registration + addresses CRUD ----
  /notifications/register-device:
    post:
      tags: [Notifications]
      summary: Register / refresh a push token (idempotent upsert)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, pushToken]
              properties:
                platform: { type: string, enum: [android, ios] }
                pushToken: { type: string, minLength: 1 }
                liveActivityToken: { type: string, minLength: 1, description: ActivityKit push token while a delivery Live Activity is in flight (iOS). }
                appVersion: { type: string }
                deviceModel: { type: string }
                osVersion: { type: string }
                locale: { type: string }
      responses:
        '200':
          description: OK — device created or rebound.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, required: [ok], properties: { ok: { type: boolean } } }
        '401': { description: Unauthorized., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Unprocessable Entity — invalid body., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /addresses:
    get:
      tags: [Addresses]
      summary: List the caller's saved addresses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Address' } }
        '401': { description: Unauthorized., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [Addresses]
      summary: Create a new address
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, required: [address], properties: { address: { $ref: '#/components/schemas/Address' } } }
        '401': { description: Unauthorized., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Unprocessable Entity — invalid body., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /addresses/{id}:
    get:
      tags: [Addresses]
      summary: Get one address (owner-scoped; 404 if owned by another)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, required: [address], properties: { address: { $ref: '#/components/schemas/Address' } } }
        '401': { description: Unauthorized., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not Found — unknown id or owned by another customer., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      tags: [Addresses]
      summary: Update an address (owner-scoped)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, required: [address], properties: { address: { $ref: '#/components/schemas/Address' } } }
        '401': { description: Unauthorized., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not Found — unknown id or owned by another customer., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Unprocessable Entity — invalid body., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Addresses]
      summary: Delete an address (owner-scoped)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, required: [ok], properties: { ok: { type: boolean } } }
        '401': { description: Unauthorized., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not Found — unknown id or owned by another customer., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /account/loyalty-pass:
    get:
      tags: [Loyalty]
      summary: Generate / refresh the customer's Apple Wallet loyalty pass (signed URL)
      description: >
        Silver tier at >=2 delivered orders, Gold at >=5. Below the threshold the
        route 404s. Returns a short-lived signed .pkpass URL the iOS client adds
        via PKAddPassesViewController.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK — pass generated/refreshed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url, serialNumber, tier]
                    properties:
                      url: { type: string, format: uri }
                      serialNumber: { type: string }
                      tier: { type: string, enum: [silver, gold] }
        '401': { description: Unauthorized., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not Found — not eligible (fewer than 2 delivered orders)., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /account/loyalty:
    get:
      tags: [Loyalty]
      summary: Read the customer's loyalty standing (no wallet-pass side effects)
      description: >
        Plain loyalty-state read for surfaces that show progress rather
        than mint a pass: deliveredCount plus the resolved tier (null below
        Silver, "silver" at >=2 delivered, "gold" at >=5) and the tier
        thresholds. Unlike /account/loyalty-pass this never 404s below the
        threshold and never writes WalletPasses.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK — loyalty standing.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [deliveredCount, tier, silverAtDelivered, goldAtDelivered]
                    properties:
                      deliveredCount: { type: integer, minimum: 0 }
                      tier: { type: [string, 'null'], enum: [silver, gold, null] }
                      silverAtDelivered: { type: integer, description: Delivered orders needed for Silver (2). }
                      goldAtDelivered: { type: integer, description: Delivered orders needed for Gold (5). }
        '401': { description: Unauthorized., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /reviews:
    get:
      tags: [Reviews]
      summary: List approved reviews for one product (public)
      description: >
        Moderation-approved reviews only, newest first, paginated.
        productId is required. Authors appear as display names — customer
        ids and phones are never returned. averageRating and total cover
        ALL approved reviews for the product, not just this page. The
        write side stays capture-only (POST below, pending moderation).
      security: []
      parameters:
        - in: query
          name: productId
          required: true
          schema: { type: string, minLength: 1 }
          description: mithai-products id.
        - in: query
          name: page
          schema: { type: integer, default: 1, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: OK — one page of approved reviews + aggregate rating.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ReviewList' }
        '422':
          description: Unprocessable Entity — missing/invalid productId or pagination.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Reviews]
      summary: Upsert the customer's review for one product (capture-only)
      description: >
        Creates or updates ONE review per (customer, product). Body is
        zod-validated (rating 1-5 required); verifiedPurchase is
        server-stamped — true with the linked order when the customer has
        a delivered order containing the product. Reviews start as
        "pending" for moderation and are not displayed anywhere yet.
        201 on create, 200 on update.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200':
          description: OK — existing (customer, product) review updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Review' }
        '201':
          description: Created — new review row.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Review' }
        '401': { description: Unauthorized., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not Found — product no longer exists., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Unprocessable Entity — invalid body such as a rating outside 1-5 or a missing productId., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /wallet/register-pass-device:
    post:
      tags: [Wallet]
      summary: Register a device token for Apple Wallet .pass updates (idempotent)
      description: >
        Called by the iOS app after the user adds the loyalty pass to Wallet.
        Stores the pass-update token on the WalletPasses row so the backend can
        push .pass update pings when the loyalty balance / tier changes.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PassDeviceInput' }
      responses:
        '200':
          description: OK — token registered or already present.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, required: [ok], properties: { ok: { type: boolean } } }
        '401': { description: Unauthorized., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not Found — no active owned pass for this serial., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Unprocessable Entity — invalid body., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /wallet/unregister-pass-device:
    delete:
      tags: [Wallet]
      summary: Remove a device token from Apple Wallet .pass updates (idempotent)
      description: >
        Called by the iOS app when the user removes the loyalty pass from Wallet.
        Idempotent — 200 even if the token or pass is already gone.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PassDeviceInput' }
      responses:
        '200':
          description: OK — token removed or already absent.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, required: [ok], properties: { ok: { type: boolean } } }
        '401': { description: Unauthorized., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Unprocessable Entity — invalid body., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /stories:
    get:
      tags: [stories]
      security: []
      description: Published-stories list, newest first. Drafts excluded server-side.
      parameters:
        - in: header
          name: If-None-Match
          schema: { type: string }
        - in: query
          name: pillar
          schema:
            type: string
            enum: [farm, milk, karigar, karigari, packaging, festival, regional, recipe, journal]
        - in: query
          name: page
          schema: { type: integer, default: 1, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Paginated'
                      - type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Story' }
        '304':
          description: Not Modified
          headers:
            ETag:
              schema: { type: string }
  /stories/{slug}:
    get:
      tags: [stories]
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
          description: Unique story slug (collections/Stories.slug).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StoryDetail' }
        '404':
          description: Not Found — no published story matches the slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /brand:
    get:
      tags: [brand]
      security: []
      description: |
        Brand support contact for the apps' help surfaces. No ETag — single
        tiny doc, cached client-side.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Brand' }

  /hero:
    get:
      tags: [hero]
      security: []
      description: |
        Admin-curated home hero slides (the `home-hero` global the web
        renders). ETag over the resolved slides; If-None-Match → 304.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Hero' }

