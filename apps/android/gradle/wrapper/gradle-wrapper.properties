# apps/android/gradle/wrapper/gradle-wrapper.properties — Task 7.1.
# Gradle 8.9 (AGP 8.5.2 floor is Gradle 8.7). The wrapper jar + scripts are
# generated by `gradle wrapper` on first SDK-armed run; this properties file
# pins the distribution so CI / devs resolve the same Gradle.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
