# apps/android/gradle.properties — Task 7.1
# AndroidX is mandatory (Jetpack Compose, Hilt, Room all depend on it).
android.useAndroidX=true
# Material components migration flag for AndroidX.
android.enableJetifier=false
# Kotlin code style.
kotlin.code.style=official
# Non-transitive R classes: faster builds, smaller R — default since AGP 8.
android.nonTransitiveRClass=true
# Gradle JVM + memory. Compose + Hilt kapt are memory-hungry.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Kotlin daemon.
kotlin.incremental=true
