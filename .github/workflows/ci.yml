name: CI
on: [pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/mishran-test
      PAYLOAD_SECRET: test-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run build

  # End-to-end suite. Includes the a11y spec (tests/e2e/a11y.spec.ts) which
  # runs AxeBuilder against the core routes — no separate a11y job needed.
  e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/mishran-e2e
      PAYLOAD_SECRET: test-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run seed
      - run: npm run build
      - run: npm run test:e2e

  # Lighthouse CI — runs lhci autorun against the built app. Gated behind
  # continue-on-error: true for the first few runs because LHCI is flaky in
  # CI (CPU throttling variance, transient TTFB). Remove the flag once the
  # baseline is stable. PR-only so main pushes don't fail on a flake.
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/mishran-lhci
      PAYLOAD_SECRET: test-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run seed
      - run: npm run build
      # Start the production server in the background and wait for it.
      - name: Start app
        run: |
          npm run start &
          npx wait-on http://localhost:3000
      - run: npm run lhci

  # Maestro E2E against a live Android emulator (Task 12.1). Manual dispatch
  # only: the flows need a staging backend URL + Razorpay test mode baked
  # into the APK and a staging OTP (MAESTRO_OTP secret). Firebase Test Lab
  # can replace the hosted emulator by swapping this job's runner for
  # `gcloud firebase test android run` with the same YAMLs.
  maestro-android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Assemble debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug
      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$PATH":"$HOME/.maestro/bin"
            maestro test apps/android/maestro/
        env:
          MAESTRO_OTP: ${{ secrets.MAESTRO_OTP }}

  # Macrobenchmarks (Task 12.2): cold start (budget p95 ≤ 1.5s, Pixel 4a
  # class) + catalog scroll jank, against the release-shaped "benchmark"
  # build type. Manual dispatch: wall-clock gates are too noisy to run per
  # PR. Results are archived per run; the >5% regression gate compares
  # against the last archived baseline once a stable one exists (follow-up:
  # commit a baselineprofile + ci-perf thresholds).
  macrobenchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run macrobenchmarks on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd apps/android && ./gradlew :macrobenchmark:connectedBenchmarkAndroidTest
      - name: Archive benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macrobenchmark-results
          path: apps/android/macrobenchmark/build/outputs/connected_android_test_additional_output
