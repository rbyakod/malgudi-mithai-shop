# Task 13.3 (Mishran Mobile Apps v1): signed release AAB → Play internal track.
#
# Manual dispatch only — release builds burn Play Console upload quota and
# should be intentional. Promotions from internal → testing → production are
# done in Play Console (Task 13.4's staged rollout), not here.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64       base64 of the upload keystore (see keytool
#                                 command below). Play App Signing holds the
#                                 app signing key; this is the upload key.
#   ANDROID_KEYSTORE_PASSWORD     keystore password
#   ANDROID_KEY_ALIAS             upload key alias
#   ANDROID_KEY_PASSWORD          key password
#   ANDROID_GOOGLE_SERVICES_JSON  contents of the Firebase google-services.json
#                                 (mobile_client api key + project id; enables
#                                 the google-services + crashlytics Gradle
#                                 plugins, which only apply when this file
#                                 exists)
#   ANDROID_PLAY_SERVICE_ACCOUNT_JSON
#                                 service-account JSON with Play Console
#                                 release access (created in Google Cloud,
#                                 invited in Play Console → Users & permissions
#                                 with the "Release apps to internal track"
#                                 permission) — used by r0adkll/upload-google-play
#
# Generating the upload keystore (one-time, keep offline + backed up):
#   keytool -genkeypair -v \
#     -keystore mishran-upload.jks -alias mishran-upload \
#     -keyalg RSA -keysize 2048 -validity 10000 \
#     -dname "CN=Mishran, OU=Mobile, O=Mishran, L=Delhi, C=IN"
#   base64 -i mishran-upload.jks | gh secret set ANDROID_KEYSTORE_BASE64

name: android-release

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Provisioning gate (Task 13.3): without google-services.json the
      # Firebase Gradle plugins stay unapplied and the AAB would ship without
      # FCM/Crashlytics init values — fail fast instead of uploading a dead
      # build. The file is gitignored; CI is its only entry point.
      - name: Write google-services.json
        working-directory: apps/android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON secret is not set — see workflow header"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — see workflow header"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mishran-upload.jks"

      - name: Build signed release AAB
        working-directory: apps/android
        env:
          MISHRAN_RELEASE_KEYSTORE: ${{ runner.temp }}/mishran-upload.jks
          MISHRAN_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MISHRAN_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MISHRAN_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      # Global constraint: AAB < 25MB. Fail the upload before Play rejects it.
      - name: Enforce AAB size budget (< 25MB)
        run: |
          aab="apps/android/app/build/outputs/bundle/release/app-release.aab"
          size=$(stat -c%s "$aab")
          mb=$((size / 1024 / 1024))
          echo "AAB size: ${size} bytes (~${mb} MB)"
          if [ "$size" -ge 26214400 ]; then
            echo "::error::AAB exceeds the 25MB budget (global constraint)"
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mishran-release-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Play Console internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mishran.app
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          # changelog sourced from the en Play listing would go here once a
          # what's-new file exists; placeholder until release notes are drafted.
